services:
  - type: web
    name: reentry-to-recovery
    runtime: node
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: node server-start.mjs
    healthCheckPath: /api/health
    envVars:
      # Build-time: embedded into the client bundle by Vite
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Public CDN hostname, not secret — mirrors VITE_SUPABASE_URL above.
      # Needed client-side so extractStorageRef (src/lib/storage-url.ts) can
      # recognize existing Bunny-hosted file URLs; same value as BUNNY_CDN_HOSTNAME below.
      - key: VITE_BUNNY_CDN_HOSTNAME
        sync: false
      # Public Stream CDN hostname, not secret — same reasoning as
      # VITE_BUNNY_CDN_HOSTNAME above, but for Bunny Stream (HLS) playback URLs.
      - key: VITE_BUNNY_STREAM_CDN_HOSTNAME
        sync: false
      # Runtime: read by server-side code via process.env
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Bunny Storage zone name (from the Bunny dashboard)
      - key: BUNNY_STORAGE_ZONE
        sync: false
      # Exact API hostname shown in the Bunny dashboard's "FTP & API Access"
      # panel for this zone, e.g. storage.bunnycdn.com or ny.storage.bunnycdn.com
      - key: BUNNY_STORAGE_ENDPOINT
        sync: false
      # Storage zone AccessKey (write credential) — from the same dashboard panel
      - key: BUNNY_STORAGE_API_KEY
        sync: false
      # Bunny Pull Zone (CDN) hostname used to build public file URLs
      - key: BUNNY_CDN_HOSTNAME
        sync: false
      # Bunny Stream Video Library id (from the Bunny dashboard's Stream section)
      - key: BUNNY_STREAM_LIBRARY_ID
        sync: false
      # Bunny Stream API key (write credential) — same dashboard panel as the library id
      - key: BUNNY_STREAM_API_KEY
        sync: false
      # Bunny Stream's auto-provisioned CDN hostname, used to build HLS playback URLs
      - key: BUNNY_STREAM_CDN_HOSTNAME
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TESTER_FACILITY
        sync: false
      # Set to the header Render guarantees is the real client IP (not client-forgeable).
      # Check Render docs for your plan tier. Leave unset to use x-forwarded-for leftmost entry.
      - key: TRUSTED_IP_HEADER
        sync: false
      # Required for HMAC-signed signup captcha tokens and inmate PIN hashing.
      # Generate with: openssl rand -hex 32
      - key: SIGNUP_CHALLENGE_SECRET
        sync: false
      # SHA-256 hex of the site passkey string used for IP-gating bypass.
      # Generate with: echo -n "your-passkey" | openssl dgst -sha256
      - key: SITE_PASSKEY_HASH
        sync: false
